global:
  scrape_interval: 120s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'personalon-api-prod'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['personalon-api-prod:8080']
